# =============================================================================
# DemoBlaze E2E Automation - Configuration
# =============================================================================
# Configuration precedence (highest to lowest):
#   1. JVM system properties  (-Dproperty=value)
#   2. Environment variables  (PROPERTY_NAME in UPPER_SNAKE_CASE)
#   3. This file
#   4. Hard-coded defaults in ConfigManager.java
#
# NEVER commit passwords, API tokens, or personal data to this file.
# Use environment variables or CI secrets for sensitive values.
# =============================================================================

# --- Application ---
base.url=https://www.demoblaze.com/

# --- Browser (chrome | firefox) ---
browser=chrome
headless=false

# --- Remote / Selenium Grid ---
# Set remote=true and grid.url to run against a remote Grid node.
remote=false
# grid.url=http://selenium-hub:4444/wd/hub

# --- Timeouts ---
explicit.wait.seconds=15
page.load.timeout.seconds=30

# --- Environment ---
env=test
